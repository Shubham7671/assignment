# Lead Qualification & Readiness Assistant — application theme
#
# Dual mode. Both [theme.light] and [theme.dark] are defined, so Streamlit's
# appearance control stays available (Settings → Appearance, or the
# "Appearance" switch in the app sidebar) and the app is *designed* for both
# rather than merely surviving one of them.
#
# Chart colour is configuration, not code. Every Altair chart in the app runs
# with the default `theme="streamlit"` and reads these palettes, so a chart
# recolours itself when the mode changes. The only exception is the readiness
# band encoding, which is a STATUS scale, not a categorical series: those three
# hexes live in `ui/theme.py` with a light and a dark variant, and every band is
# always shipped with a text label and a glyph so colour never carries the
# meaning alone.

[theme]
# Shared across both modes: type, shape and spacing.
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "23px", "19px", "16px", "14px", "13px"]
headingFontWeights = [700, 650, 600, 600, 550, 550]
metricValueFontSize = "2rem"
metricValueFontWeight = 650
linkUnderline = false
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1rem"
paddingBottom = "4rem"

[theme.sidebar]
paddingTop = "0.75rem"
paddingBottom = "1.5rem"

# --------------------------------------------------------------------------
# Light mode — warm paper surface, indigo accent
# --------------------------------------------------------------------------
